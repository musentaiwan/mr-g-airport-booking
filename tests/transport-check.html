<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>Mr.G 通知連線檢查</title><script defer src="../config.js"></script><script defer src="../notification-service.js?v=2"></script><h1>通知連線檢查</h1><p>僅傳送無效格式檢查回覆，不包含客戶資料、不發送 LINE 訊息。</p><button id="check">開始檢查</button><pre id="result">尚未檢查</pre><script>
document.getElementById('check').onclick=async()=>{document.getElementById('check').disabled=true;document.getElementById('result').textContent='正在檢查';const response=await MrgNotification.submit({endpoint:MRG_CONFIG.notificationEndpoint,request:{requestId:crypto.randomUUID(),kind:'invalid',service:'invalid',sections:[]}});document.getElementById('result').textContent=response.code==='INVALID_REQUEST'?'通過：已收到通知服務的實際回覆；未發送訊息。':'未通過：'+JSON.stringify(response);document.getElementById('check').disabled=false;};
</script></html>
